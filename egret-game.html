<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>DMAX挂机英雄-egret版</title>
  <!-- 网页小角标：深紫背景 + 字母 D -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0820'/%3E%3Ctext x='16' y='24' font-size='22' font-weight='bold' text-anchor='middle' font-family='Arial,sans-serif' fill='%23fbbf24'%3ED%3C/text%3E%3C/svg%3E">
  <link rel="shortcut icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0820'/%3E%3Ctext x='16' y='24' font-size='22' font-weight='bold' text-anchor='middle' font-family='Arial,sans-serif' fill='%23fbbf24'%3ED%3C/text%3E%3C/svg%3E">
  <!-- iOS 桌面图标 -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%230a0820'/%3E%3Ctext x='90' y='130' font-size='120' font-weight='bold' text-anchor='middle' font-family='Arial,sans-serif' fill='%23fbbf24'%3ED%3C/text%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /*
     * 竖屏优先铺满视口，让战斗背景真正全屏；横屏/宽桌面再锁 9:16，
     * 避免 fixedWidth 模式在过宽比例下把逻辑高度压得过低。
     */
    html, body {
      background: #1a1a2e;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      /* 刘海屏 / PWA 全屏安全区；普通浏览器里为 0，不影响桌面 */
      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* 横屏或宽桌面：回到稳定的 9:16 画布，防止 UI 被横向比例压扁。 */
    @media (orientation: landscape), (hover: hover) and (pointer: fine) and (min-width: 600px) {
      #game-container {
        width: min(100vw, calc(min(880px, 100dvh) * 9 / 16));
        height: min(880px, 100dvh, calc(100vw * 16 / 9));
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        border-radius: 12px;
        overflow: hidden;
      }
    }

    /* 详细日志 / 错误层：默认隐藏，仅失败时显示；层级高于加载卡片，保证错误可见可点。 */
    #status {
      display: none;
      color: #0f0; position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px;
      font-family: monospace; font-size: 12px; z-index: 1100; background: rgba(0,0,0,0.7);
      padding: 4px 8px; border-radius: 4px; white-space: pre-line; max-width: 90%;
      pointer-events: auto;
    }

    /*
     * 首次进入的加载进度卡片。
     * preloadGameImages() 在 egret.runEgret() 之前跑完，94 张素材（约 18MB）下载期间
     * canvas 尚未建立、game.js 里的 Egret 启动遮罩根本不存在，纯 DOM 层是唯一能覆盖
     * 这段时间的载体。纯 CSS + 原生 setTimeout，不依赖 Egret Tween / rAF（§12 事故）。
     */
    #boot-loading {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 32%, #2b2352 0%, #1a1a2e 58%, #0d0b1c 100%);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #f4d789;
      opacity: 1;
      transition: opacity 260ms ease;
      pointer-events: none;
    }
    #boot-loading.is-hidden { opacity: 0; }
    #boot-loading.is-error { pointer-events: auto; cursor: pointer; }
    #boot-loading.is-error .sub { color: #ffb4a8; }
    #boot-loading .card { width: min(300px, 78vw); text-align: center; }
    #boot-loading .badge {
      width: 64px; height: 64px; line-height: 64px; margin: 0 auto 18px;
      border-radius: 16px; background: #0a0820; color: #fbbf24;
      font-size: 38px; font-weight: 700; box-shadow: 0 8px 30px rgba(0,0,0,.45);
    }
    #boot-loading .title { font-size: 19px; letter-spacing: 3px; font-weight: 600; }
    #boot-loading .sub {
      margin: 12px 0 20px; min-height: 20px;
      font-size: 13px; line-height: 1.5; color: #cfc6e8;
      word-break: break-all;
    }
    #boot-loading .track {
      height: 8px; border-radius: 99px; overflow: hidden;
      background: rgba(255,255,255,.12);
    }
    #boot-loading .fill {
      height: 100%; width: 0%; border-radius: 99px;
      background: linear-gradient(90deg, #fbbf24, #7be8b7);
      transition: width 200ms ease;
    }
    #boot-loading .meta {
      display: flex; justify-content: space-between; margin-top: 10px;
      font-size: 12px; color: #9a90bb;
    }
  </style>
</head>
<body>
  <div id="status">加载引擎中...</div>
  <div id="boot-loading" role="status" aria-live="polite">
    <div class="card">
      <div class="badge">D</div>
      <div class="title">DMAX 挂机英雄</div>
      <div class="sub" id="boot-sub">正在准备游戏…</div>
      <div class="track"><div class="fill" id="boot-fill"></div></div>
      <div class="meta"><span id="boot-pct">0%</span><span id="boot-count">载入中</span></div>
    </div>
  </div>
  <!--
    必须加 class="egret-player" + data-* 属性：
    egret.runEgret() 内部会 querySelectorAll('.egret-player') 找容器并为每个
    容器 new WebPlayer(...)。直接 new egret.web.WebPlayer(...) 会绕过 runEgret
    的 bootstrap（Html5Capatibility.$init / sys.RenderBuffer 赋值 / screenAdapter
    初始化等），导致 "e.sys.RenderBuffer is not a constructor" 崩溃。
  -->
  <div id="game-container"
       class="egret-player"
       data-entry-class="Main"
       data-scale-mode="fixedWidth"
       data-frame-rate="60"
       data-content-width="375"
       data-content-height="667"
       data-orientation="auto"
       data-multi-fingered="2"
       data-show-fps="false"
       data-show-log="false"></div>
  <script>
    var statusEl = document.getElementById('status');
    var container = document.getElementById('game-container');
    var BUILD_VERSION = 'gameplay-20260613-wx-ui-loop-polish-1';
    window.DMAX_GAME_VERSION = BUILD_VERSION;
    var scripts = [
      'lib/egret/egret.min.js',
      'lib/egret/egret.web.min.js',
      'lib/game/game.min.js',
      'lib/res/res.min.js',
      'lib/tween/tween.min.js',
      'lib/eui/eui.min.js',
      'game.js'
    ];

    // 逻辑宽度固定 375（fixedWidth 缩放模式）
    var LOGICAL_W = 375;

    // ===== 首次进入的加载进度 =====
    // loadScript / preloadGameImages 早已通过 setBootLoading(text, pct) 传回阶段文字与
    // 百分比，此前 H5 把该函数置空并把 #status 设为 display:none，导致最慢的素材下载
    // 阶段整屏只有纯色背景。这里补上可见载体，不改动任何调用点。
    var bootEl = document.getElementById('boot-loading');
    var bootSub = document.getElementById('boot-sub');
    var bootFill = document.getElementById('boot-fill');
    var bootPct = document.getElementById('boot-pct');
    var bootCount = document.getElementById('boot-count');
    var bootDone = false;
    var bootPctValue = 0;
    var bootGuardTimer = null;
    var bootErrPoll = null;
    window.DMAX_BOOT_STATE = 'loading';

    function setBootLoading(text, pct) {
      if (!bootEl || bootDone) return;
      var v = Math.max(0, Math.min(100, Number(pct) || 0));
      if (v > bootPctValue) bootPctValue = v;   // 失败重试时百分比不回跳
      if (bootSub) bootSub.textContent = text || '正在准备游戏…';
      if (bootFill) bootFill.style.width = bootPctValue + '%';
      if (bootPct) bootPct.textContent = bootPctValue + '%';
      if (bootCount) {
        var m = /素材预加载\s*(\d+)\s*\/\s*(\d+)/.exec(text || '');
        if (m) bootCount.textContent = '素材 ' + m[1] + ' / ' + m[2];
        else if (/^加载\s/.test(text || '')) bootCount.textContent = '引擎脚本';
        else if (/重试/.test(text || '')) bootCount.textContent = '正在重试';
      }
    }

    function showBootError(msg) {
      if (!bootEl || bootDone) return;
      window.DMAX_BOOT_STATE = 'error';
      if (bootSub) bootSub.textContent = msg;
      if (bootCount) bootCount.textContent = '点击刷新重试';
      bootEl.className = 'is-error';
      bootEl.onclick = function() { location.reload(); };
      if (statusEl) { statusEl.style.display = 'block'; statusEl.textContent = msg; }
    }

    function hideBootLoading() {
      if (bootDone || !bootEl) return;
      setBootLoading('准备完成', 100);
      bootDone = true;
      window.DMAX_BOOT_STATE = 'hidden';
      try { clearTimeout(bootGuardTimer); } catch (e) {}
      try { clearInterval(bootErrPoll); } catch (e) {}
      // 纯原生 setTimeout 兜底：不依赖 Egret Tween / rAF / 任何游戏回调（§6 红线 9、§12 教训）
      setTimeout(function() {
        if (!bootEl) return;
        bootEl.className = 'is-hidden';
        setTimeout(function() {
          if (bootEl && bootEl.parentNode) bootEl.parentNode.removeChild(bootEl);
          window.__dmaxBootLoadingRemoved = true;
        }, 320);
      }, 160);
    }

    window.DMAX_HIDE_LOADING = function() {
      hideBootLoading();
      // 二次兜底：若 Main 的启动遮罩仍在（iframe / 后台标签节流导致 tween 未跑），
      // 直接再触发一次隐藏，避免永久停在「构建首帧中...」。
      try {
        var m = window.__dmaxMain;
        if (m && typeof m.hideBootOverlay === 'function') m.hideBootOverlay();
      } catch (e) {}
    };

    // game.js 里 new Game() 抛错时只置 __dmaxBootError、不回调 HTML 层，这里把它转成可见错误态。
    bootErrPoll = setInterval(function() {
      if (bootDone) { clearInterval(bootErrPoll); return; }
      if (window.__dmaxBootError) {
        clearInterval(bootErrPoll);
        showBootError('启动失败：' + window.__dmaxBootError);
      }
    }, 300);

    // 硬兜底：60s 后无论何种状态都淡出遮罩，绝不永久挡住画面。
    bootGuardTimer = setTimeout(function() {
      if (bootDone) return;
      if (window.__dmaxBootError) { showBootError('启动失败：' + window.__dmaxBootError); return; }
      hideBootLoading();
      if (statusEl) {
        statusEl.style.display = 'block';
        statusEl.textContent += '\n加载较慢，已跳过等待；若画面未出现请刷新页面。';
      }
    }, 60000);

    /**
     * 容器被锁成 9:16，所以理论上 stageHeight 恒等于 375 × 16/9 ≈ 667。
     * 但实际运行中设备像素舍入、浏览器 sub-pixel 布局会让容器高 ±1~2px。
     * 这里按真实测量重算一次，避免偶发的 1px 偏差引入渲染模糊。
     */
    function computeContentHeight() {
      var rect = container.getBoundingClientRect();
      var w = rect.width || window.innerWidth || 1;
      var h = rect.height || window.innerHeight || 1;
      return Math.max(1, Math.floor(h * LOGICAL_W / w));
    }

    function handleResize() {
      // runEgret 把 WebPlayer 挂在 container['egret-player'] 上
      var p = container['egret-player'];
      if (!p) return;
      try {
        p.setContentSize(LOGICAL_W, computeContentHeight());
      } catch (e) { /* 忽略，下次 resize 会再尝试 */ }
    }

    function preloadGameImages(done) {
      var assets = (window.DMAX_PRELOAD_ASSETS || []).filter(Boolean);
      if (!assets.length || typeof Image === 'undefined') { done(); return; }
      var seen = {};
      assets = assets.filter(function(src) {
        if (seen[src]) return false;
        seen[src] = true;
        return true;
      });
      var critical = {};
      (window.DMAX_CRITICAL_ASSETS || []).forEach(function(src) { critical[src] = true; });
      var total = assets.length;
      var doneCount = 0;
      var index = 0;
      var active = 0;
      var finished = false;
      var failed = [];
      var concurrency = 3;
      var maxRetry = 3;
      var timeout = setTimeout(function() {
        if (finished) return;
        statusEl.textContent += '\n网络较慢，继续重试素材...';
        if (bootSub) bootSub.textContent = '网络较慢，正在加载素材…';
      }, 9000);

      function finishOne(src, ok, tries) {
        doneCount++;
        active--;
        if (!ok) failed.push({ src: src, tries: tries || 0, critical: !!critical[src] });
        statusEl.textContent = '素材预加载 ' + doneCount + '/' + total + (failed.length ? '，失败重试 ' + failed.length : '');
        setBootLoading('素材预加载 ' + doneCount + '/' + total, 35 + Math.floor(doneCount / total * 45));
        if (doneCount >= total && !finished) {
          if (failed.length) {
            retryFailed();
          } else {
            finishPreload('');
          }
          return;
        }
        pump();
      }

      function finishPreload(note) {
        if (finished) return;
        finished = true;
        clearTimeout(timeout);
        if (note) statusEl.textContent += '\n' + note;
        done();
      }

      function retryFailed() {
        var criticalFailed = failed.filter(function(item) { return item.critical; });
        var retryable = failed.filter(function(item) { return item.tries < maxRetry; });
        if (retryable.length) {
          assets = retryable.map(function(item) { return item.src; });
          total = assets.length;
          doneCount = 0;
          index = 0;
          active = 0;
          failed = [];
          statusEl.textContent = '素材加载不稳定，正在重试 ' + total + ' 个...';
          setBootLoading('素材加载不稳定，正在重试...', 72);
          pump();
          return;
        }
        if (criticalFailed.length) {
          statusEl.textContent = '关键素材加载失败 ' + criticalFailed.length + ' 个，点击这里重试';
          setBootLoading('关键素材加载失败，点击重试', 78);
          showBootError('关键素材加载失败 ' + criticalFailed.length + ' 个，点击刷新重试');
          statusEl.style.cursor = 'pointer';
          statusEl.onclick = function() {
            statusEl.onclick = null;
            statusEl.style.cursor = 'default';
            preloadGameImages(done);
          };
          return;
        }
        finishPreload('部分非关键素材稍后再加载，先进入游戏...');
      }

      function pump() {
        while (!finished && active < concurrency && index < total) {
          var src = assets[index++];
          var tries = 0;
          active++;
          function load() {
            var loader = new Image();
            loader.onload = function() { finishOne(src, true, tries); };
            loader.onerror = function() {
              tries++;
              if (tries < maxRetry) {
                setTimeout(load, 450 * tries);
              } else {
                finishOne(src, false, tries);
              }
            };
            loader.src = src + (src.indexOf('?') >= 0 ? '&' : '?') + 'r=' + tries;
          }
          load();
        }
      }

      pump();
    }

    function loadScript(idx) {
      if (idx >= scripts.length) {
        statusEl.textContent += '\n引擎脚本就绪，初始化...';
        setBootLoading('引擎就绪，初始化...', 34);
        preloadGameImages(function() {
          try {
            // 先把初始高度写到 data-content-height，再调 runEgret。
            // runEgret 内部会完成必要的 bootstrap 并自动构造 WebPlayer。
            container.setAttribute('data-content-height', String(computeContentHeight()));
            egret.runEgret({
              renderMode: 'canvas',
              audioType: 0
            });
            setBootLoading('启动成功，进入游戏...', 92);

            // 防抖，避免 iOS 地址栏抖动时频繁触发
            var resizeTimer = null;
            function debouncedResize() {
              if (resizeTimer) clearTimeout(resizeTimer);
              resizeTimer = setTimeout(function() { resizeTimer = null; handleResize(); }, 120);
            }
            window.addEventListener('resize', debouncedResize);
            window.addEventListener('orientationchange', function() {
              setTimeout(handleResize, 300);
            });
            if (window.visualViewport) {
              window.visualViewport.addEventListener('resize', debouncedResize);
            }

            statusEl.textContent += '\n启动成功!';
            setTimeout(function() { statusEl.style.display = 'none'; }, 350);
            setTimeout(function() {
              if (window.__dmaxGame && window.DMAX_HIDE_LOADING) window.DMAX_HIDE_LOADING();
            }, 700);
          } catch(e) {
            statusEl.textContent += '\n[ERR] ' + e.message;
            setBootLoading('启动失败：' + e.message, 100);
            showBootError('启动失败：' + e.message);
          }
        });
        return;
      }
      var s = document.createElement('script');
      s.src = scripts[idx] + (scripts[idx] === 'game.js' ? '?v=' + BUILD_VERSION + '&t=' + Date.now() : '');
      s.onload = function() {
        var name = scripts[idx].split('/').pop();
        statusEl.textContent = (idx+1) + '/' + scripts.length + ' OK ' + name;
        setBootLoading('加载 ' + name, 8 + Math.floor((idx + 1) / scripts.length * 24));
        loadScript(idx + 1);
      };
      s.onerror = function() {
        statusEl.textContent += '\n[ERR] 加载失败: ' + scripts[idx];
        setBootLoading('加载失败：' + scripts[idx], 100);
        showBootError('加载失败：' + scripts[idx] + '，点击刷新重试');
      };
      document.head.appendChild(s);
    }

    loadScript(0);
  </script>
</body>
</html>
